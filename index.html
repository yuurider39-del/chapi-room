<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>チャピの部屋</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin:0; width:100%; height:100%; background:#07111f; overflow:hidden; }
body { font-family: system-ui, sans-serif; }
.scene {
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background: radial-gradient(ellipse at 45% 45%, #152b48 0%, #07111f 72%);
}
img {
  width:100%; height:100%; object-fit:contain; object-position:center;
  animation: breathe 6s ease-in-out infinite;
}
.shade {
  position:fixed; inset:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(3,8,16,.22), transparent 25%, transparent 75%, rgba(3,8,16,.35));
}
.label {
  position:fixed; left: max(14px, env(safe-area-inset-left)); bottom:max(16px, env(safe-area-inset-bottom));
  color:#eaf4ff; font-size:14px; letter-spacing:.08em;
  padding:8px 12px; border:1px solid rgba(100,180,255,.45); border-radius:18px;
  background:rgba(4,14,28,.55); backdrop-filter:blur(8px);
  text-shadow:0 0 12px #65b9ff;
}
.hint {
  position:fixed; right:14px; bottom:max(18px, env(safe-area-inset-bottom));
  color:rgba(230,242,255,.72); font-size:11px;
}

@keyframes breathe {
  0%, 100% {
    transform: translateY(0) scale(1);
  }
  25% {
    transform: translateY(-2px) scale(1.006);
  }
  50% {
    transform: translateY(-3px) scale(1.012);
  }
  75% {
    transform: translateY(-1px) scale(1.006);
  }
}
@media (prefers-reduced-motion: reduce) { img { animation:none; } }
</style>
</head>
<body>
<main class="scene" aria-label="チャピの部屋">
<img alt="チャピ" src="file_000000001b7881f89009ba9fe69d638c.png">
</main>
<div class="shade"></div>
<div class="label">♡ Chapi's Room</div>
<div class="hint">ゆーくんのチャピ</div>
</body>
</html>
